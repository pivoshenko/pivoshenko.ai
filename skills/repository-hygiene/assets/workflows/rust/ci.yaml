# === workflows/rust/ci.yaml ===
# Purpose:  Lands at `.github/workflows/ci.yaml`. PR gate for rust-cli / rust-lib variant: `just install`, `just lint`, `just test`, `just build`.
# Tokens:   none
# Override: Add a target matrix if cross-compiling in CI. Action versions are pinned by references/action-versions.yaml.
# === end ===

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: just install

      - name: Run linters
        run: just lint

      - name: Run tests
        run: just test

      - name: Build
        run: just build
