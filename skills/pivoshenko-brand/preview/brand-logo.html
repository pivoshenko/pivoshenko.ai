<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brand · Logo & Wordmark</title>
    <link rel="stylesheet" href="_base.css" />
    <style>
      body {
        padding: 0;
        display: flex;
      }
      .pane {
        flex: 1;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        justify-content: center;
      }
      .pane.dark {
        background: #000;
        color: var(--stone-100);
      }
      .pane.dark .fg-muted {
        color: var(--stone-500);
      }
      .pane.dark .fg-body {
        color: var(--stone-400);
      }
      .mark {
        width: 44px;
        height: 44px;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 23px;
        letter-spacing: -0.7px;
      }
      .pane.dark .mark {
        background: #fff;
        color: #000;
      }
      .wordmark {
        font-family: var(--font-mono);
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.025em;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
    </style>
  </head>
  <body>
    <div class="pane">
      <div class="row">
        <div class="mark">VP</div>
        <div class="col gap-1">
          <span class="wordmark">pivoshenko.theme</span>
          <span class="type-meta fg-muted">type-logo · JetBrains Mono 14/600</span>
        </div>
      </div>
      <div class="type-meta fg-muted">App icon · 32×32 · JetBrains Mono 17/700 · -0.5px</div>
    </div>
    <div class="pane dark">
      <div class="row">
        <div class="mark">VP</div>
        <div class="col gap-1">
          <span class="wordmark">pivoshenko.dev</span>
          <span class="type-meta fg-muted">Light surface inverts to white-on-black</span>
        </div>
      </div>
      <div class="type-meta fg-muted">Wordmark is text, not an asset</div>
    </div>
  </body>
</html>
