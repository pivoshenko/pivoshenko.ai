<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Components · Palette table</title>
<link rel="stylesheet" href="_base.css"/>
<style>
  body { padding: 0; background: var(--bg-page); }
  .wrap { padding: 18px; }
  .table { width: 100%; border: 1px solid var(--border-ui); border-radius: 4px; background: var(--bg-card); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; font-family: var(--font-mono); font-size: 12px; }
  thead th { color: var(--fg-muted-c); text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--border-ui); font-weight: 400; }
  tbody tr + tr td { border-top: 1px solid var(--border-faint); }
  .name-cell { display:flex; align-items:center; gap: 8px; color: var(--fg-primary); }
  .dot { width: 16px; height: 16px; border-radius: 999px; border: 1px solid var(--border-ui); }
  .val { color: var(--fg-secondary); display:inline-flex; align-items:center; gap: 8px; }
  .copy { display:inline-flex; align-items:center; justify-content: center; width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--border-ui); color: var(--fg-muted-c); }
  .copy.ok { color: var(--status-success-fg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="table">
    <table>
      <thead><tr><th>Token</th><th>Hex</th><th>RGB</th></tr></thead>
      <tbody>
        <tr>
          <td><span class="name-cell"><span class="dot" style="background:rgb(var(--accent-primary))"></span>accent-primary<span class="copy"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span></span></td>
          <td><span class="val">#d97757<span class="copy"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span></span></td>
          <td><span class="val">217 119 87<span class="copy"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span></span></td>
        </tr>
        <tr>
          <td><span class="name-cell"><span class="dot" style="background:rgb(var(--accent-secondary))"></span>accent-secondary</span></td>
          <td><span class="val">#d4a85a</span></td>
          <td><span class="val">212 168 90</span></td>
        </tr>
        <tr>
          <td><span class="name-cell"><span class="dot" style="background:rgb(var(--accent-success))"></span>accent-success</span></td>
          <td><span class="val">#8a9d68</span></td>
          <td><span class="val">138 157 104<span class="copy ok"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></span></span></td>
        </tr>
        <tr>
          <td><span class="name-cell"><span class="dot" style="background:rgb(var(--accent-danger))"></span>accent-danger</span></td>
          <td><span class="val">#c87a72</span></td>
          <td><span class="val">200 122 114</span></td>
        </tr>
        <tr>
          <td><span class="name-cell"><span class="dot" style="background:rgb(var(--accent-info))"></span>accent-info</span></td>
          <td><span class="val">#7ba0c4</span></td>
          <td><span class="val">123 160 196</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
