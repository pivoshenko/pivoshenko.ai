<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Components · Tabs</title>
    <link rel="stylesheet" href="_base.css" />
    <style>
      body {
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .label {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* Underline tab — same pattern as the live theme-showcase nav.
     Active = darker fg + 2px accent underline. Inactive = subtle, hover -> primary. */
      .tabs {
        display: flex;
        align-items: stretch;
        gap: 0;
        border-bottom: 1px solid var(--border-ui);
      }
      .tab {
        padding: 8px 14px;
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--fg-subtle);
        cursor: pointer;
        position: relative;
      }
      .tab:hover {
        color: var(--fg-secondary);
      }
      .tab.active {
        color: var(--fg-primary);
      }
      .tab.active::after {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: -1px;
        height: 2px;
        background: var(--accent);
      }

      /* Segmented control — alternative pattern for 2–3 options of equal weight */
      .seg {
        display: inline-flex;
        border: 1px solid var(--border-ui);
        border-radius: 4px;
        overflow: hidden;
      }
      .seg button {
        background: transparent;
        border: 0;
        padding: 6px 12px;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--fg-subtle);
        cursor: pointer;
      }
      .seg button + button {
        border-left: 1px solid var(--border-ui);
      }
      .seg button.active {
        background: var(--bg-tag);
        color: var(--fg-primary);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="label">UNDERLINE TABS — used in pivoshenko.theme nav</div>
      <div class="tabs" style="margin-top: 8px">
        <div class="tab active">Colors</div>
        <div class="tab">Ports</div>
        <div class="tab">Userstyles</div>
      </div>
    </div>
    <div>
      <div class="label">SEGMENTED — same intent, smaller surface</div>
      <div style="margin-top: 8px">
        <div class="seg">
          <button class="active">All</button>
          <button>Recent</button>
          <button>Archive</button>
        </div>
      </div>
    </div>
    <div>
      <div class="label">UNDERLINE TABS — alternate selection</div>
      <div class="tabs" style="margin-top: 8px">
        <div class="tab">accent</div>
        <div class="tab active">text</div>
        <div class="tab">surface</div>
      </div>
    </div>
    <div>
      <div class="label">SEGMENTED — theme toggle</div>
      <div style="margin-top: 8px">
        <div class="seg">
          <button>light</button>
          <button class="active">dark</button>
          <button>auto</button>
        </div>
      </div>
    </div>
  </body>
</html>
