<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Components · Tabs</title>
<link rel="stylesheet" href="_base.css"/>
<style>
  body { padding: 22px; background: var(--bg-page); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted-c); text-transform: uppercase; letter-spacing: 0.1em; }

  /* Underline tab — active = darker fg + 2px accent underline. */
  .tabs { display: flex; align-items: stretch; gap: 0; border-bottom: 1px solid var(--border-ui); }
  .tab {
    padding: 8px 14px;
    font-family: var(--font-mono); font-size: 14px;
    color: var(--fg-subtle-c); cursor: pointer;
    position: relative;
  }
  .tab:hover { color: var(--fg-primary); }
  .tab.active { color: var(--fg-primary); }
  .tab.active::after {
    content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px;
    background: var(--accent);
  }

  /* Segmented control — 2–3 options of equal weight */
  .seg { display: inline-flex; border: 1px solid var(--border-ui); border-radius: 4px; overflow: hidden; }
  .seg button {
    background: transparent; border: 0;
    padding: 6px 12px;
    font-family: var(--font-mono); font-size: 13px;
    color: var(--fg-subtle-c); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border-ui); }
  .seg button.active { background: var(--bg-elevated); color: var(--fg-primary); }
</style>
</head>
<body>
  <div class="col">
    <div>
      <div class="label">UNDERLINE TABS — used in the theme-showcase nav</div>
      <div class="tabs" style="margin-top: 8px">
        <div class="tab active">Colors</div>
        <div class="tab">Ports</div>
        <div class="tab">Userstyles</div>
      </div>
    </div>
    <div>
      <div class="label">SEGMENTED — same intent, smaller surface</div>
      <div style="margin-top: 8px">
        <div class="seg">
          <button class="active">All</button>
          <button>Recent</button>
          <button>Archive</button>
        </div>
      </div>
    </div>
  </div>
  <div class="col">
    <div>
      <div class="label">UNDERLINE TABS — alt selection</div>
      <div class="tabs" style="margin-top: 8px">
        <div class="tab">accent</div>
        <div class="tab active">text</div>
        <div class="tab">surface</div>
      </div>
    </div>
    <div>
      <div class="label">SEGMENTED — alt selection</div>
      <div style="margin-top: 8px">
        <div class="seg">
          <button>day</button>
          <button class="active">week</button>
          <button>month</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
