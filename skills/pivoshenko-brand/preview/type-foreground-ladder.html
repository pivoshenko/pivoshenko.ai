<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Type · Foreground ladder</title>
<link rel="stylesheet" href="_base.css"/>
<style>
  body { padding: 24px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
  .row { display:flex; align-items:baseline; gap:16px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.1em; width: 100px; flex-shrink: 0; }
  .swatch { font-family: var(--font-mono); font-size: 13px; }
</style>
</head>
<body>
  <div class="row"><span class="name">fg-primary</span><span class="swatch fg-primary">The quick brown fox</span></div>
  <div class="row"><span class="name">fg-title</span><span class="swatch fg-title">The quick brown fox</span></div>
  <div class="row"><span class="name">fg-secondary</span><span class="swatch fg-secondary">The quick brown fox</span></div>
  <div class="row"><span class="name">fg-body</span><span class="swatch fg-body">The quick brown fox</span></div>
  <div class="row"><span class="name">fg-subtle</span><span class="swatch fg-subtle">The quick brown fox</span></div>
  <div class="row"><span class="name">fg-muted</span><span class="swatch fg-muted">The quick brown fox</span></div>
</body>
</html>
