<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Components · Empty states & feedback</title>
    <link rel="stylesheet" href="_base.css" />
    <style>
      body {
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        justify-content: center;
      }
      .label {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .empty {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--fg-subtle);
      }

      /* Skeleton — never used in production, but documented if needed */
      .skel {
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .skel-date {
        width: 48px;
        height: 12px;
        background: var(--bg-tag-active);
      }
      .skel-stack {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .skel-row {
        height: 12px;
        background: var(--bg-tag-active);
        border-radius: 2px;
      }
      .skel-row.long {
        width: 70%;
      }
      .skel-row.short {
        width: 40%;
      }

      /* Inline feedback */
      .toast {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border-ui);
        padding: 8px 12px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 12px;
        background: var(--bg-card);
      }
      .toast .ic {
        color: #8ea98c;
        display: inline-flex;
      }
      .toast .msg {
        color: var(--fg-secondary);
      }

      .meta-row {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg-subtle);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .meta-row .sep {
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="label">EMPTY STATE — sentence, never illustrated</div>
      <p class="empty" style="margin-top: 8px">No posts yet.</p>
    </div>
    <div>
      <div class="label">META ROW — date · separator · reading time</div>
      <div class="meta-row" style="margin-top: 8px">
        <time>March 20, 2026</time>
        <span class="sep" aria-hidden="true">·</span>
        <span>5 min read</span>
      </div>
    </div>
    <div>
      <div class="label">INLINE FEEDBACK — green-accent flash, 1.2s</div>
      <div style="margin-top: 8px">
        <span class="toast">
          <span class="ic">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          <span class="msg">Copied #c98787</span>
        </span>
      </div>
    </div>
    <div>
      <div class="label">LOADING — skeleton (not in production, documented for needs)</div>
      <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 16px">
        <div class="skel">
          <div class="skel-date"></div>
          <div class="skel-stack">
            <div class="skel-row long"></div>
            <div class="skel-row short"></div>
          </div>
        </div>
        <div class="skel">
          <div class="skel-date"></div>
          <div class="skel-stack">
            <div class="skel-row long"></div>
            <div class="skel-row short"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
