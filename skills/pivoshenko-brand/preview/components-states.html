<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Components · Empty states & feedback</title>
    <link rel="stylesheet" href="_base.css" />
    <style>
      body {
        padding: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .pane {
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        justify-content: center;
      }
      .pane.dark {
        background: #000;
      }
      .label {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--stone-400);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .pane.dark .label {
        color: var(--stone-500);
      }
      .empty {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--stone-500);
      }
      .pane.dark .empty {
        color: var(--stone-500);
      }

      /* Skeleton — never used in production, but documented if needed */
      .skel {
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .skel-date {
        width: 48px;
        height: 12px;
        background: var(--stone-200);
      }
      .pane.dark .skel-date {
        background: var(--stone-800);
      }
      .skel-stack {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .skel-row {
        height: 12px;
        background: var(--stone-200);
        border-radius: 2px;
      }
      .pane.dark .skel-row {
        background: var(--stone-800);
      }
      .skel-row.long {
        width: 70%;
      }
      .skel-row.short {
        width: 40%;
      }

      /* Inline feedback */
      .toast {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--stone-200);
        padding: 8px 12px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 12px;
        background: var(--white);
      }
      .pane.dark .toast {
        border-color: var(--stone-800);
        background: var(--stone-950);
      }
      .toast .ic {
        color: #8ea98c;
        display: inline-flex;
      }
      .toast .msg {
        color: var(--stone-700);
      }
      .pane.dark .toast .msg {
        color: var(--stone-300);
      }

      .meta-row {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--stone-500);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .pane.dark .meta-row {
        color: var(--stone-500);
      }
      .meta-row .sep {
        color: var(--stone-400);
      }
    </style>
  </head>
  <body>
    <div class="pane">
      <div>
        <div class="label">EMPTY STATE — sentence, never illustrated</div>
        <p class="empty" style="margin-top: 8px">No posts yet.</p>
      </div>
      <div>
        <div class="label">META ROW — date · separator · reading time</div>
        <div class="meta-row" style="margin-top: 8px">
          <time>March 20, 2026</time>
          <span class="sep" aria-hidden="true">·</span>
          <span>5 min read</span>
        </div>
      </div>
      <div>
        <div class="label">INLINE FEEDBACK — green-accent flash, 1.2s</div>
        <div style="margin-top: 8px">
          <span class="toast">
            <span class="ic">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </span>
            <span class="msg">Copied #c98787</span>
          </span>
        </div>
      </div>
    </div>
    <div class="pane dark">
      <div>
        <div class="label">LOADING — skeleton (not in production, documented for needs)</div>
        <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 16px">
          <div class="skel">
            <div class="skel-date"></div>
            <div class="skel-stack">
              <div class="skel-row long"></div>
              <div class="skel-row short"></div>
            </div>
          </div>
          <div class="skel">
            <div class="skel-date"></div>
            <div class="skel-stack">
              <div class="skel-row long"></div>
              <div class="skel-row short"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
