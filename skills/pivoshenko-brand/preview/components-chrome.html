<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Components · Nav chrome</title>
    <link rel="stylesheet" href="_base.css" />
    <style>
      body {
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .strip {
        width: 100%;
      }
      .strip.dark {
        background: #000;
        color: var(--stone-100);
      }
      .strip.dark .border {
        border-color: var(--stone-800);
      }
      .strip.dark .fg-muted {
        color: var(--stone-500);
      }
      .strip.dark .fg-subtle {
        color: var(--stone-400);
      }
      .nav {
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-ui);
      }
      .footer {
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        justify-content: space-between;
        border-top: 1px solid var(--border-ui);
      }
      .links {
        display: flex;
        align-items: center;
        gap: 0;
      }
      .links a {
        font-family: var(--font-mono);
        font-size: 14px;
        padding: 6px 12px;
      }
      .active {
        color: var(--stone-900);
      }
      .strip.dark .active {
        color: var(--stone-100);
      }
      .inactive {
        color: var(--stone-500);
      }
      .strip.dark .inactive {
        color: var(--stone-500);
      }
      .divider {
        width: 1px;
        height: 16px;
        background: var(--stone-200);
        margin: 0 6px;
      }
      .strip.dark .divider {
        background: var(--stone-800);
      }
      .ic {
        width: 16px;
        height: 16px;
        color: var(--stone-400);
      }
      .strip.dark .ic {
        color: var(--stone-500);
      }
      .ic-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <div class="strip">
      <div class="nav">
        <span class="type-logo fg-primary">pivoshenko.dev</span>
        <div class="links">
          <a class="active">Home</a>
          <a class="inactive">Blog</a>
          <span class="divider"></span>
          <a class="inactive" style="padding: 6px 8px"
            ><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg
          ></a>
        </div>
      </div>
    </div>
    <div class="strip dark">
      <div class="footer">
        <span class="type-meta fg-muted">2026 Volodymyr Pivoshenko &lt;contact@pivoshenko.dev&gt;</span>
        <div class="ic-row">

            />
          </svg>
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"

            />
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
