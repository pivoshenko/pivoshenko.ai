<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brand · Iconography</title>
    <link rel="stylesheet" href="_base.css" />
    <style>
      body {
        padding: 24px;
      }
      .label {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--stone-400);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        gap: 24px;
        align-items: center;
      }
      .ic-box {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--stone-700);
      }
      .ic-box svg {
        width: 16px;
        height: 16px;
      }
      .demo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--stone-500);
      }
      .group {
        padding: 12px 0;
        border-top: 1px solid var(--border-faint);
      }
      .group:first-of-type {
        border-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="group">
      <div class="label">LUCIDE — interface icons (stroke 1.75–2, color: currentColor)</div>
      <div class="row">
        <div class="demo">
          <div class="ic-box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
          </div>
          <span class="meta">Copy</span>
        </div>
        <div class="demo">
          <div class="ic-box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              <polyline points="15 3 21 3 21 9" />
              <line x1="10" y1="14" x2="21" y2="3" />
            </svg>
          </div>
          <span class="meta">ExternalLink</span>
        </div>
        <div class="demo">
          <div class="ic-box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"
              />
              <path d="m7 16.5-4.74-2.85" />
              <path d="m7 16.5 5-3" />
              <path d="M7 16.5v5.17" />
              <path
                d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"
              />
            </svg>
          </div>
          <span class="meta">Boxes</span>
        </div>
        <div class="demo">
          <div class="ic-box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
            </svg>
          </div>
          <span class="meta">Bookmark</span>
        </div>
        <div class="demo">
          <div class="ic-box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="15" y2="12" />
              <line x1="3" y1="18" x2="12" y2="18" />
            </svg>
          </div>
          <span class="meta">List (TOC)</span>
        </div>
        <div class="demo">
          <div class="ic-box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </div>
          <span class="meta">Moon</span>
        </div>
        <div class="demo">
          <div class="ic-box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              />
            </svg>
          </div>
          <span class="meta">Sun</span>
        </div>
      </div>
    </div>

      <div class="label">SIMPLE ICONS — brand glyphs (footer only)</div>

              />
            </svg>
          </div>
          <span class="meta">GitHub</span>
        </div>
        <div class="demo">
          <div class="ic-box">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"

            </svg>
          </div>
          <span class="meta">LinkedIn</span>
        </div>
        <div class="demo">
          <div class="ic-box">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M19.199 24C19.199 13.467 10.533 4.8 0 4.8V0c13.165 0 24 10.835 24 24h-4.801zM3.291 17.415a3.3 3.3 0 0 1 3.293 3.295A3.303 3.303 0 0 1 3.283 24C1.47 24 0 22.526 0 20.71s1.475-3.294 3.291-3.295zM15.909 24h-4.665c0-6.169-5.075-11.245-11.244-11.245V8.09c8.727 0 15.909 7.184 15.909 15.91z"
              />
            </svg>
          </div>
          <span class="meta">RSS</span>
        </div>
      </div>
    </div>
    <div class="group">
      <div class="label">UNICODE GLYPHS — used as text</div>
      <div class="row">
        <span class="type-ui" style="color: var(--stone-700)"
          >All posts <span style="color: var(--stone-400)">→</span></span
        >
        <span class="type-ui" style="color: var(--stone-700)"><span style="color: var(--stone-400)">←</span> Blog</span>
        <span class="type-ui" style="color: var(--stone-700)"
          >github <span style="color: var(--stone-400)">↗</span></span
        >
        <span class="type-meta" style="color: var(--stone-500)">2026 <span>·</span> 5 min read</span>
      </div>
    </div>
  </body>
</html>
