<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Components · Form inputs</title>
<link rel="stylesheet" href="_base.css"/>
<style>
  body { padding: 22px; background: var(--bg-page); display: flex; flex-direction: column; gap: 18px; max-width: 520px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted-c); text-transform: uppercase; letter-spacing: 0.1em; }

  /* Text field */
  .field {
    display: block; width: 100%; box-sizing: border-box;
    font-family: var(--font-mono); font-size: 13px;
    padding: 8px 10px;
    border: 1px solid rgb(var(--border-default));
    border-radius: 4px;
    background: rgb(var(--bg-surface));
    color: rgb(var(--fg-default));
    outline: none;
  }
  .field::placeholder { color: rgb(var(--fg-subtle)); }
  .field:hover { border-color: rgb(var(--border-strong)); }
  .field.focus { border-color: rgb(var(--border-strong)); outline: 2px solid rgb(var(--accent-primary)); outline-offset: 2px; }
  .field[disabled] { opacity: 0.5; cursor: not-allowed; }
  .field.error { border-color: rgb(var(--accent-danger)); }

  /* Search field — leading icon */
  .search { position: relative; }
  .search svg.lead {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: rgb(var(--fg-subtle));
    pointer-events: none;
  }
  .search .field { padding-left: 30px; }

  /* Textarea */
  textarea.field { resize: vertical; min-height: 80px; line-height: 1.5; }

  /* Checkbox */
  .check {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 13px;
    color: rgb(var(--fg-muted));
    cursor: pointer;
  }
  .box {
    width: 14px; height: 14px;
    border: 1px solid rgb(var(--border-strong)); border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgb(var(--bg-surface));
    color: transparent;
    flex-shrink: 0;
  }
  .box.checked {
    background: rgb(var(--accent-primary));
    border-color: rgb(var(--accent-primary));
    color: rgb(var(--bg-canvas));
  }

  .hint { font-family: var(--font-mono); font-size: 11px; color: rgb(var(--fg-faint)); margin-top: 4px; }
  .hint.error { color: rgb(var(--accent-danger)); }

  .stack { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="stack">
    <span class="label">TEXT FIELD — default</span>
    <input class="field" type="text" placeholder="contact@pivoshenko.dev" />
  </div>

  <div class="stack">
    <span class="label">TEXT FIELD — focused</span>
    <input class="field focus" type="text" value="contact@pivoshenko.dev" />
  </div>

  <div class="stack">
    <span class="label">TEXT FIELD — error</span>
    <input class="field error" type="text" value="not-an-email" />
    <span class="hint error">Must be a valid email.</span>
  </div>

  <div class="stack">
    <span class="label">TEXT FIELD — disabled</span>
    <input class="field" type="text" value="readonly@pivoshenko.dev" disabled />
  </div>

  <div class="stack">
    <span class="label">SEARCH — leading icon</span>
    <div class="search">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="field" type="text" placeholder="search posts…" />
    </div>
  </div>

  <div class="stack">
    <span class="label">TEXTAREA</span>
    <textarea class="field" placeholder="A short note…"></textarea>
  </div>

  <div class="stack">
    <span class="label">CHECKBOX</span>
    <div class="row">
      <label class="check">
        <span class="box"></span>
        Subscribe to RSS
      </label>
      <label class="check">
        <span class="box checked"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>
        Send via email
      </label>
    </div>
  </div>
</body>
</html>
