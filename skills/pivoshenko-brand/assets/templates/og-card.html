<!doctype html>
<!--
  1200x630 social / OG card. Hex is inlined intentionally - @vercel/og and
  most headless screenshotters do not resolve CSS custom properties.
  Render to PNG via:
    npx playwright screenshot --viewport-size=1200,630 og-card.html out.png
  or pass the same markup to satori / @vercel/og.

  These hexes are mirrored by hand from colors_and_type.css, which is itself
  mirrored from the design system's tokens.json. Re-check them after any
  token change - nothing here fails loudly when they drift.

    --bg-canvas       #1f1f1e
    --fg-default      #e4e2de
    --fg-muted        #b8b3a8
    --fg-subtle       #9b958a
    --fg-faint        #78716c   decorative only, never small text
    --border-default  #2e2e2c
    --overlay0        #57534e
    --accent-primary  #d97757   swap this one hex to repoint the accent

  Contours cannot run in a screenshotter, so the card uses the system's
  documented static fallback: a 16px dot grid of --overlay0.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;800&family=Martian+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 64px;
        background: #1f1f1e;
        color: #e4e2de;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* == Pattern == */

      .field {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#57534e 1px, transparent 1.5px);
        background-size: 16px 16px;
        opacity: 0.35;
        -webkit-mask-image: radial-gradient(ellipse 70% 80% at 78% 30%, #000 20%, transparent 72%);
        mask-image: radial-gradient(ellipse 70% 80% at 78% 30%, #000 20%, transparent 72%);
      }

      body > *:not(.field) { position: relative; }

      /* == Lockup == */

      .lockup {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.55px;
      }

      /* Typeset mark, accent notch at bottom-right */
      .mark {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 6px;
        background: #e4e2de;
        color: #1f1f1e;
        display: grid;
        place-items: center;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.8px;
        line-height: 1;
      }
      .mark::after {
        content: "";
        position: absolute;
        right: -5px;
        bottom: -5px;
        width: 13px;
        height: 13px;
        border-radius: 4px;
        background: #d97757;
        box-shadow: 0 0 0 4px #1f1f1e;
      }

      .dot { color: #78716c; }
      .suffix { color: #d97757; }

      /* == Copy == */

      .kicker {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: auto;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9b958a;
      }
      .kicker::before { content: "//"; color: #d97757; letter-spacing: 0; }

      h1 {
        font-family: "Martian Mono", "JetBrains Mono", ui-monospace, monospace;
        font-size: 60px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.04em;
        margin: 16px 0 24px;
        max-width: 980px;
      }

      .subtitle {
        font-size: 22px;
        line-height: 1.45;
        color: #b8b3a8;
        max-width: 900px;
      }

      /* == Rules == */

      .accent-line {
        position: absolute;
        left: 64px;
        bottom: 56px;
        width: 96px;
        height: 2px;
        background: #d97757;
      }

      .dashed-line {
        position: absolute;
        left: 176px;
        right: 64px;
        bottom: 57px;
        height: 1px;
        background: repeating-linear-gradient(90deg, #2e2e2c 0 4px, transparent 4px 8px);
      }

      .byline {
        position: absolute;
        right: 64px;
        bottom: 28px;
        font-size: 14px;
        color: #9b958a;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>

  <body>
    <div class="field"></div>

    <div class="lockup">
      <span class="mark">{{ INITIALS }}</span>
      <span>pivoshenko<span class="dot">.</span><span class="suffix">{{ SURFACE }}</span></span>
    </div>

    <div class="kicker">{{ KICKER }}</div>
    <h1>{{ TITLE }}</h1>
    <div class="subtitle">{{ SUBTITLE }}</div>

    <div class="accent-line"></div>
    <div class="dashed-line"></div>
    <div class="byline">{{ DOMAIN }}</div>
  </body>
</html>
