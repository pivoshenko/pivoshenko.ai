# === workflows/next/ci.yaml ===
# Purpose:  Lands at `.github/workflows/ci.yaml`. PR gate for next-site variant: `just install`, `just lint`, `just build`. Vercel handles deployment.
# Tokens:   none
# Override: Add `just test` if the site grows tests. Adjust `node-version` if the project pins elsewhere. Action versions are pinned by references/action-versions.yaml.
# === end ===

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: just install

      - name: Run linters
        run: just lint

      - name: Run audit
        run: just audit

      - name: Build
        run: just build
