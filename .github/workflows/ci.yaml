name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: just install
      - run: just lint

  audit:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: just install
      - run: just audit

  test:
    needs: [lint, audit]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - if: ${{ hashFiles('.no-tests') == '' }}
        uses: extractions/setup-just@v3
      - if: ${{ hashFiles('.no-tests') == '' }}
        uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - if: ${{ hashFiles('.no-tests') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - if: ${{ hashFiles('.no-tests') == '' }}
        run: just install
      - if: ${{ hashFiles('.no-tests') == '' }}
        run: just test

  build:
    needs: [test]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: just install
      - run: just build
