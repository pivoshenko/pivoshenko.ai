<!doctype html>
<!--
  Print-tuned dark document. Render to PDF via:
    chromium --headless --disable-gpu --no-margins \
             --print-to-pdf=out.pdf document.html
  or any HTML->PDF pipeline that respects @page.

  The dark background is intentional - the system is dark only, PDFs
  included. Make sure the renderer does not strip background colours
  (Chrome respects -webkit-print-color-adjust).

  Two things are deliberately re-derived for paper, per the porting rubric:
  depth and the pattern. Print has no shadow and no live field, so a raised
  surface falls back to its border alone and Contours is dropped rather
  than faked. Everything else - the palette, both faces, the // section
  label, the accent - renders as it does on screen.
-->
<html lang="en" data-accent="peach">
  <head>
    <meta charset="utf-8" />
    <title>{{ TITLE }}</title>
    <link rel="stylesheet" href="../../colors_and_type.css" />
    <style>
      @page {
        size: A4;
        margin: 18mm 16mm;
        background: #1f1f1e; /* renderer floor, in case body is clipped */
      }

      html, body {
        background: var(--bg-canvas);
        color: var(--fg-default);
        font-family: var(--font-mono);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body { margin: 0; }

      /* == Type == */

      h1 {
        font-family: var(--font-display);
        font-size: 20pt;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.035em;
        margin: 0 0 6pt;
      }

      .subtitle { font-size: 11pt; color: var(--fg-subtle); margin: 0 0 24pt; }

      /* The section label keeps its // in the accent, as on screen */
      h2 {
        display: flex;
        align-items: center;
        gap: 8pt;
        font-size: 9pt;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--fg-subtle);
        margin: 24pt 0 8pt;
      }
      h2::before { content: "//"; color: var(--accent); letter-spacing: 0; }
      h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: repeating-linear-gradient(90deg, var(--border-strong) 0 4px, transparent 4px 8px);
      }

      p, li {
        font-size: 10.5pt;
        line-height: 1.625;
        color: var(--fg-muted);
        margin: 0 0 8pt;
      }

      ul { padding-left: 1.2em; }
      li::marker { color: var(--accent); }

      a {
        color: var(--fg-default);
        text-decoration: underline;
        text-decoration-color: var(--accent);
        text-underline-offset: 2pt;
      }

      strong { color: var(--fg-default); font-weight: 600; }

      /* == Surfaces == */

      /* On paper the lit top edge and the shadow are gone, so the border
         carries the separation on its own - see the header comment */
      code {
        background: var(--bg-raised);
        color: var(--accent-secondary);
        border-radius: 2pt;
        padding: 1pt 3pt;
        font-size: 9.5pt;
      }

      pre {
        background: var(--crust);
        border: 1px solid var(--border-card);
        border-radius: 7pt;
        padding: 10pt;
        overflow: hidden;
        font-size: 9.5pt;
        color: var(--fg-muted);
      }
      pre code { background: none; color: inherit; padding: 0; }

      blockquote {
        margin: 0 0 8pt;
        padding: 2pt 0 2pt 10pt;
        border-left: 1px solid var(--border-strong);
        color: var(--fg-subtle);
      }

      table { width: 100%; border-collapse: collapse; margin: 0 0 8pt; font-size: 9.5pt; }
      th, td { padding: 4pt 6pt; border-bottom: 1px solid var(--border-subtle); text-align: left; }
      th { color: var(--fg-default); font-weight: 600; }

      /* == Chrome == */

      .doc-header, .doc-footer { font-size: 8.5pt; color: var(--fg-subtle); }

      .doc-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-default);
        padding-bottom: 6pt;
        margin-bottom: 18pt;
      }

      .doc-footer {
        display: flex;
        justify-content: space-between;
        margin-top: 24pt;
        padding-top: 6pt;
        border-top: 1px dashed var(--border-strong);
      }

      .lockup { display: inline-flex; align-items: center; gap: 6pt; font-weight: 600; letter-spacing: -0.025em; }

      /* The mark is typeset here too, notch included */
      .mark {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 14pt;
        height: 14pt;
        border-radius: 3pt;
        background: var(--fg-default);
        color: var(--bg-canvas);
        font-size: 7pt;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .mark::after {
        content: "";
        position: absolute;
        right: -1.5pt;
        bottom: -1.5pt;
        width: 4pt;
        height: 4pt;
        border-radius: 1pt;
        background: var(--accent);
        box-shadow: 0 0 0 1pt var(--bg-canvas);
      }

      .root { color: var(--fg-default); }
      .dot { color: var(--fg-faint); }
      .suffix { color: var(--accent); }

      /* == Page Breaks == */

      h2 { break-after: avoid; }
      h1 + p, h2 + p { break-before: avoid; }
      pre, table, blockquote { break-inside: avoid; }
    </style>
  </head>

  <body>
    <div class="doc-header">
      <span class="lockup">
        <span class="mark">{{ INITIALS }}</span>
        <span class="root">pivoshenko</span><span class="dot">.</span><span class="suffix">{{ SURFACE }}</span>
      </span>
      <span>{{ DATE }}</span>
    </div>

    <h1>{{ TITLE }}</h1>
    <p class="subtitle">{{ SUBTITLE }}</p>

    <h2>{{ SECTION }}</h2>
    <p>{{ BODY }}</p>

    <div class="doc-footer">
      <span>Volodymyr Pivoshenko &lt;contact@pivoshenko.dev&gt;</span>
      <span>{{ PAGE_LABEL }}</span>
    </div>
  </body>
</html>
