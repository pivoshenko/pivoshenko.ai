[project]
name = "pivoshenko.ai"
version = "1.0.0"
description = "pivoshenko.ai"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
formatters = ["ruff~=0.15.6"]
linters = ["ruff~=0.15.6"]

[tool.ruff]
extend-exclude = ["skills/skill-creator/scripts"]
fix = true
line-length = 100
target-version = "py313"
unsafe-fixes = true

[tool.ruff.lint]
ignore = ["D", "G004", "T201", "INP001", "COM812"]
select = ["ALL"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = false
length-sort-straight = true
lines-after-imports = 2
lines-between-types = 1
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
